  <style>
    :root {
      --safe-bottom: max(20px, env(safe-area-inset-bottom));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #090909;
      color: #fff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    body {
      min-height: 100svh;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      overflow: hidden;
      background: #080808;
    }

    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: -4;
      background: #080808;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.08) 0%,
          rgba(0,0,0,.11) 36%,
          rgba(0,0,0,.42) 69%,
          rgba(0,0,0,.78) 100%
        );
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      box-shadow: inset 0 0 140px rgba(0,0,0,.44);
    }

    .content {
      width: min(100%, 520px);
      padding: 20px;
      text-align: center;
      animation: contentIn .85s ease both;
    }

    .participar {
      appearance: none;
      border: 0;
      width: min(100%, 390px);
      min-height: 58px;
      padding: 16px 28px;
      border-radius: 16px;
      cursor: pointer;
      color: #07140c;
      background: linear-gradient(180deg, #47df7d 0%, #26bd5e 100%);
      box-shadow:
        0 14px 34px rgba(38,189,94,.28),
        0 0 0 0 rgba(71,223,125,.48);
      font-size: clamp(18px, 4.6vw, 21px);
      font-weight: 850;
      letter-spacing: .2px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transform: translateZ(0);
      animation: pulseButton 2.1s infinite;
      transition: transform .18s ease, filter .18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .participar:hover {
      filter: brightness(1.04);
      transform: translateY(-2px);
    }

    .participar:active {
      transform: scale(.985);
    }

    .arrow {
      font-size: 1.08em;
      line-height: 1;
      transition: transform .2s ease;
    }

    .participar:hover .arrow {
      transform: translateX(3px);
    }

    .security {
      margin: 15px auto 0;
      max-width: 390px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      color: rgba(255,255,255,.84);
      font-size: 12.5px;
      line-height: 1.35;
      text-shadow: 0 1px 10px rgba(0,0,0,.5);
    }

    .security svg {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      opacity: .95;
    }

    .security strong {
      color: #fff;
      font-weight: 700;
    }

    .subsecurity {
      margin: 5px 0 0;
      color: rgba(255,255,255,.58);
      font-size: 10.5px;
      letter-spacing: .08px;
    }

    .tap-hint {
      margin: 0 0 11px;
      color: rgba(255,255,255,.74);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .9px;
      text-transform: uppercase;
      opacity: .9;
    }

    @keyframes pulseButton {
      0% {
        box-shadow:
          0 14px 34px rgba(38,189,94,.28),
          0 0 0 0 rgba(71,223,125,.42);
      }
      55% {
        box-shadow:
          0 14px 34px rgba(38,189,94,.28),
          0 0 0 14px rgba(71,223,125,0);
      }
      100% {
        box-shadow:
          0 14px 34px rgba(38,189,94,.28),
          0 0 0 0 rgba(71,223,125,0);
      }
    }

    @keyframes contentIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .participar {
        min-height: 62px;
      }

      .security {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content,
      .participar {
        animation: none;
      }

      .participar {
        transition: none;
      }
    }
  </style>
</head>

  <script>
    (function () {
      const DESTINO = 'https://oficialrota22.netlify.app/';
      const btn = document.getElementById('participarBtn');
      if (!btn) return;

      function montarDestino() {
        const destino = new URL(DESTINO);
        const atual = new URLSearchParams(window.location.search);

        atual.forEach((value, key) => {
          destino.searchParams.set(key, value);
        });

        return destino.toString();
      }

      btn.href = montarDestino();

      btn.addEventListener('click', function () {
        try {
          if (typeof fbq === 'function') {
            fbq('trackCustom', 'PreLanderParticipar', {
              destination: 'oficialrota22'
            });
          }
        } catch (e) {}
      });

      const video = document.querySelector('.bg-video');
      if (video) {
        video.muted = true;
        video.play().catch(function () {});
      }
    })();
  </script>
